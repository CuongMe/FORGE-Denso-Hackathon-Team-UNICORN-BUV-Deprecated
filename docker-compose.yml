services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - forge-qdrant:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FORGE_RUNTIME_MODE: production
      FORGE_INCLUDE_SOURCE_PACK: "1"
      FORGE_QDRANT_URL: http://qdrant:6333
      FORGE_QDRANT_COLLECTION: forge_chunks
      FORGE_STATE_DB_PATH: /workspace/data/.forge-state/forge.sqlite3
      FORGE_HF_OFFLINE: ${FORGE_HF_OFFLINE:-0}
      FORGE_VISUAL_PROVIDER: florence2
      FORGE_VISUAL_MODEL: microsoft/Florence-2-base-ft
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      FORGE_ADMIN_API_KEY: ${FORGE_ADMIN_API_KEY:?Set FORGE_ADMIN_API_KEY in .env}
    volumes:
      - ./data/denso_factory_hack_data_prep:/workspace/data/denso_factory_hack_data_prep:ro
      - forge-state:/workspace/data/.forge-state
      - forge-uploads:/workspace/data/uploads
      - forge-ingestion-cache:/workspace/data/.forge-cache
      - forge-model-cache:/root/.cache
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=15))['ready']"]
      interval: 60s
      timeout: 20s
      start_period: 15m
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_FORGE_API_URL: http://127.0.0.1:8000/api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  forge-qdrant:
  forge-state:
  forge-uploads:
  forge-ingestion-cache:
  forge-model-cache:
