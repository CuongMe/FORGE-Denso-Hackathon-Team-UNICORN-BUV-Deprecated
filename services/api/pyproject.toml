[project]
name = "forge-api"
version = "0.1.0"
description = "FORGE multimodal retrieval and grounded answer API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
    "docling>=2.0,<3.0",
    "torch>=2.0,<3.0",
    "transformers>=4.40,<4.50",
    "einops>=0.8,<1.0",
    "timm>=1.0,<2.0",
    "qdrant-client[fastembed]>=1.15,<2.0",
    "sentence-transformers>=5.0,<6.0",
    "google-genai>=1.0,<2.0",
    "hf-xet>=1.1,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
